<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Input Barang Toko</title>

  <!-- Favicon / Icon URL Browser -->
  <link rel="icon" type="image/png" href="Scanner.png">

  <!-- Library Eksternal: ZXing (Scanner Barcode) & SheetJS (Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Berkas CSS Terpisah (Mobile-First) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- Header Aplikasi Mobile -->
    <header class="app-header">
      <img src="Scanner.png" alt="Logo Scanner" class="app-logo">
      <div>
        <h1>Input Barang Toko</h1>
        <p class="sub">Scan barcode atau masukkan manual</p>
      </div>
    </header>

    <!-- Panel 1: Kamera Scanner & Input Barcode -->
    <section class="panel">
      <!-- Jendela Kamera dengan Animasi Laser Scan -->
      <div class="view">
        <video id="v" playsinline muted></video>
        <div class="frame"></div>
        <div class="flash" id="fl"></div>
      </div>

      <!-- Kontrol Kamera -->
      <div class="row">
        <button id="cam" class="btn-block">📷 Mulai kamera</button>
        <select id="dev" aria-label="Pilih kamera" style="display:none"></select>
      </div>

      <!-- Kolom Input Scanner USB / Ketik Manual -->
      <div class="row">
        <input type="text" id="man" placeholder="Scan barcode USB / ketik, lalu Enter" aria-label="Input scanner">
      </div>

      <!-- Opsi Cepat (Checkbox) -->
      <div class="chk-group">
        <label class="chk">
          <input type="checkbox" id="fast"> Langsung +1 (barang dikenal)
        </label>
        <label class="chk">
          <input type="checkbox" id="beep" checked> Bunyi beep
        </label>
      </div>

      <!-- Notifikasi Status & Kartu Konfirmasi Barang -->
      <div id="status" role="status"></div>
      <div id="card"></div>
    </section>

    <!-- Panel 2: Manajemen Data Excel & Tabel Riwayat Scan -->
    <section class="panel">
      <!-- Grid Tombol Aksi Excel 2x2 Ramah Sentuhan -->
      <div class="grid-actions">
        <button id="imp">📥 Impor Data (.xlsx)</button>
        <input type="file" id="file" accept=".xlsx,.xls" hidden>
        <button id="link" class="alt">🔗 Hubungkan Excel</button>
        <button id="dl">⬇️ Unduh .xlsx</button>
        <button id="clr" class="alt">🗑️ Hapus Catatan</button>
      </div>

      <p class="sub" id="stat" style="margin-top:10px"></p>
      <p class="sub" id="linked"></p>

      <!-- Tabel Riwayat Catatan Scan -->
      <div class="table-header">
        <h2>Riwayat Scan</h2>
      </div>
      <div class="tw">
        <table>
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Barcode</th>
              <th>Barang</th>
              <th>Jml</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
        <div class="empty" id="empty"></div>
      </div>
    </section>
  </main>

  <!-- Berkas JavaScript Terpisah -->
  <script src="script.js"></script>
</body>
</html>
