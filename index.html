<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Barang Toko</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef2ee;--panel:#fff;--ink:#17261f;--mute:#5d6e65;--line:#cfd9d2;--accent:#0f6b4a;--accent-ink:#fff;--warn:#b4442a}
@media (prefers-color-scheme:dark){:root{--bg:#101814;--panel:#17221c;--ink:#e6efe9;--mute:#93a69b;--line:#2b3b32;--accent:#4cc38a;--accent-ink:#06140d;--warn:#ff8a6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px;display:grid;gap:16px;grid-template-columns:minmax(0,390px) minmax(0,1fr)}
@media(max-width:820px){main{grid-template-columns:1fr}}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.view{position:relative;aspect-ratio:4/3;background:#000;border-radius:8px;overflow:hidden;margin-top:10px}
video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:8%;right:8%;top:30%;bottom:30%;border:3px solid var(--accent);border-radius:10px;pointer-events:none}
.flash{position:absolute;inset:0;background:var(--accent);opacity:0;pointer-events:none;transition:opacity .4s}
.flash.on{opacity:.45;transition:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button,select,input{font:inherit}
button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number]{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=number]{flex:0 0 90px}
label.chk{display:flex;gap:6px;align-items:center;color:var(--mute)}
#status{min-height:22px;margin-top:8px;color:var(--mute)}
#status.warn{color:var(--warn)}
#card{margin-top:10px}
.cardbox{border:2px solid var(--accent);border-radius:10px;padding:12px}
.cardbox p{margin:0 0 6px}
.res{display:grid;gap:6px;margin-top:8px}
.res button{text-align:left}
small{color:var(--mute)}
.tw{overflow:auto;max-height:62vh}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--panel);color:var(--mute);font-weight:600}
td button{padding:3px 9px;font-size:13px}
.empty{color:var(--mute);padding:24px 6px}
</style>
</head>
<body>
<main>
<section class="panel">
  <h1>Input barang toko</h1>
  <p class="sub">Scan barcode, nama barang langsung muncul dari daftar master.</p>
  <div class="view"><video id="v" playsinline muted></video><div class="frame"></div><div class="flash" id="fl"></div></div>
  <div class="row">
    <button id="cam">Mulai kamera</button>
    <select id="dev" aria-label="Pilih kamera" style="display:none"></select>
  </div>
  <div class="row"><input type="text" id="man" placeholder="Kolom scanner USB atau ketik barcode, lalu Enter" aria-label="Input scanner"></div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="fast"> Langsung tambah 1 (barang yang sudah dikenal)</label>
    <label class="chk"><input type="checkbox" id="beep" checked> Bunyi</label>
  </div>
  <div id="status" role="status"></div>
  <div id="card"></div>
</section>

<section class="panel">
  <div class="row" style="margin-top:0">
    <button id="imp">Impor master (.xlsx)</button>
    <input type="file" id="file" accept=".xlsx,.xls" hidden>
    <button id="link" class="alt">Hubungkan ke file Excel</button>
    <button id="dl">Unduh .xlsx</button>
    <button id="clr" class="alt">Kosongkan catatan</button>
  </div>
  <p class="sub" id="stat" style="margin-top:8px"></p>
  <p class="sub" id="linked"></p>
  <div class="tw" style="margin-top:8px">
    <table><thead><tr><th>Waktu</th><th>Barcode</th><th>Barang</th><th>Jml</th><th></th></tr></thead><tbody id="body"></tbody></table>
    <div class="empty" id="empty"></div>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const KEY="toko-v2";
let S={master:[],map:{},log:[]},byId={},hay={},card=null,handle=null,stream=null,timer=null,last="",lastT=0,saving=false,dirty=false;
try{const x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&x.master)S=x}catch(e){}

function h(t,p,...k){const e=document.createElement(t);Object.assign(e,p||{});k.forEach(x=>e.append(x));return e}
function say(t,warn){const s=$("status");s.textContent=t;s.className=warn?"warn":""}
function fmt(d){return new Date(d).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"medium"})}
function index(){byId={};hay={};S.master.forEach(m=>{byId[m.id]=m;hay[m.id]=(m.nama+" "+m.kode).toLowerCase()})}
function find(q){
  const t=q.toLowerCase().split(/\s+/).filter(Boolean);if(!t.length)return[];
  return S.master.filter(m=>t.every(w=>hay[m.id].includes(w))).slice(0,8);
}
function focusMan(){setTimeout(()=>$("man").focus(),0)}

/* ---------- tampilan ---------- */
function render(){
  const n=new Set(Object.values(S.map)).size;
  $("stat").textContent=S.master.length?S.master.length+" barang di master, "+n+" sudah punya barcode, "+S.log.length+" catatan scan":"";
  $("empty").textContent=S.master.length?"Belum ada catatan. Scan barcode pertama.":"Impor file master_barang.xlsx dulu untuk memulai.";
  $("empty").style.display=S.log.length?"none":"block";
  const b=$("body");b.innerHTML="";
  for(let i=S.log.length-1,c=0;i>=0&&c<200;i--,c++){
    const l=S.log[i],m=byId[l.id],tr=document.createElement("tr");
    [fmt(l.t),l.bc,m?m.nama:"(barang dihapus)",l.qty].forEach(v=>tr.append(h("td",{textContent:v})));
    const x=h("button",{className:"alt",textContent:"Hapus"});x.onclick=()=>{S.log.splice(i,1);after()};
    tr.append(h("td",{},x));b.append(tr);
  }
}
function renderCard(){
  const el=$("card");el.innerHTML="";if(!card)return;
  const box=h("div",{className:"cardbox"});
  const cancel=h("button",{className:"alt",textContent:"Batal",type:"button"});
  cancel.onclick=()=>{card=null;renderCard();focusMan()};
  if(card.pending){
    const q=h("input",{type:"text",placeholder:"Ketik nama atau kode barang"}),res=h("div",{className:"res"});
    q.oninput=()=>{
      res.innerHTML="";
      find(q.value).forEach(m=>{const b=h("button",{className:"alt",type:"button"},m.nama,h("small",{textContent:"  "+m.kode}));b.onclick=()=>pick(m.id);res.append(b)});
    };
    q.onkeydown=e=>{if(e.key==="Enter"){const f=find(q.value)[0];if(f)pick(f.id)}};
    const add=h("button",{className:"alt",type:"button",textContent:"Tidak ada di daftar"});add.onclick=addNew;
    box.append(h("p",{textContent:"Barcode "+card.bc+" belum dikenal. Cari barangnya:"}),h("div",{className:"row",style:"margin-top:0"},q),res,h("div",{className:"row"},add,cancel));
    el.append(box);q.focus();return;
  }
  const m=byId[card.id];
  const nm=h("input",{type:"text",value:m.nama,"aria-label":"Nama barang"});
  const qty=h("input",{type:"number",value:1,min:1,"aria-label":"Jumlah"});
  const ok=h("button",{type:"button",textContent:"Catat"});
  const go=()=>commit(nm.value,parseInt(qty.value,10)||1);
  ok.onclick=go;nm.onkeydown=qty.onkeydown=e=>{if(e.key==="Enter")go()};
  const re=h("button",{className:"alt",type:"button",textContent:"Salah barang"});
  re.onclick=()=>{delete S.map[card.bc];card={bc:card.bc,pending:true};persist();renderCard()};
  box.append(h("p",{},h("small",{textContent:"Barcode "+card.bc+" · "+m.kode})),
    h("div",{className:"row",style:"margin-top:0"},nm,qty),
    h("div",{className:"row"},ok,re,cancel));
  el.append(box);qty.focus();qty.select();
}

/* ---------- logika ---------- */
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){say("Penyimpanan browser penuh. Unduh Excel sekarang.",true)}}
function after(){persist();render();saveLinked()}
function pick(id){S.map[card.bc]=id;persist();card={bc:card.bc,id};renderCard()}
function addNew(){
  const n=prompt("Nama barang baru:");if(!n||!n.trim())return;
  const id=S.master.reduce((a,m)=>Math.max(a,m.id),0)+1;
  S.master.push({id,kat:"",sup:"",sat:"",kode:"BRG"+id,nama:n.trim()});index();pick(id);
}
function flash(){
  if($("beep").checked){try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
  const f=$("fl");f.classList.add("on");setTimeout(()=>f.classList.remove("on"),60);
}
function commit(name,qty){
  const m=byId[card.id];if(name.trim())m.nama=name.trim();
  S.log.push({t:Date.now(),bc:card.bc,id:card.id,qty});
  say("Tercatat: "+m.nama+" × "+qty);card=null;renderCard();flash();after();focusMan();
}
function scan(v){
  v=(v||"").trim();if(!v||card)return;
  if(!S.master.length){say("Impor master_barang.xlsx dulu.",true);return}
  const now=Date.now();if(v===last&&now-lastT<2500)return;last=v;lastT=now;
  const id=S.map[v];
  if(id&&byId[id]){
    if($("fast").checked){S.log.push({t:now,bc:v,id,qty:1});say("+1 "+byId[id].nama);flash();after();return}
    card={bc:v,id};flash();renderCard();
  }else{card={bc:v,pending:true};flash();renderCard()}
}

/* ---------- Excel ---------- */
async function importMaster(f){
  try{
    const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    if(!rows.length||!("nama_barang" in rows[0])||!("id" in rows[0])){say("Kolom id dan nama_barang tidak ditemukan di sheet pertama.",true);return}
    S.master=rows.filter(r=>r.nama_barang!==""&&r.id!=="").map(r=>({id:Number(r.id),kat:r.id_kategori,sup:r.id_supplier,sat:r.id_satuan,kode:String(r.kode_barang),nama:String(r.nama_barang)}));
    if("barcode" in rows[0]){
      S.map={};
      rows.forEach(r=>String(r.barcode).split("|").map(x=>x.trim()).filter(Boolean).forEach(b=>S.map[b]=Number(r.id)));
    }
    index();say("Master dimuat: "+S.master.length+" barang.");after();
  }catch(e){say("File tidak bisa dibaca. Pastikan formatnya .xlsx.",true)}
}
function workbook(){
  const stok={},bcs={};
  S.log.forEach(l=>stok[l.id]=(stok[l.id]||0)+l.qty);
  Object.entries(S.map).forEach(([b,id])=>(bcs[id]=bcs[id]||[]).push(b));
  const a=[["id","id_kategori","id_supplier","id_satuan","kode_barang","nama_barang","barcode","stok_masuk"]];
  S.master.forEach(m=>a.push([m.id,m.kat,m.sup,m.sat,m.kode,m.nama,(bcs[m.id]||[]).join(" | "),stok[m.id]||""]));
  const l=[["waktu","barcode","kode_barang","nama_barang","jumlah"]];
  S.log.forEach(x=>{const m=byId[x.id]||{};l.push([fmt(x.t),x.bc,m.kode||"",m.nama||"",x.qty])});
  const wb=XLSX.utils.book_new(),w1=XLSX.utils.aoa_to_sheet(a),w2=XLSX.utils.aoa_to_sheet(l);
  w1["!cols"]=[{wch:6},{wch:11},{wch:11},{wch:9},{wch:12},{wch:44},{wch:22},{wch:11}];
  w2["!cols"]=[{wch:22},{wch:18},{wch:12},{wch:44},{wch:8}];
  XLSX.utils.book_append_sheet(wb,w1,"master_barang");XLSX.utils.book_append_sheet(wb,w2,"log_scan");return wb;
}
async function saveLinked(){
  if(!handle)return;if(saving){dirty=true;return}
  saving=true;
  try{
    const out=XLSX.write(workbook(),{bookType:"xlsx",type:"array"});
    const w=await handle.createWritable();await w.write(out);await w.close();
    $("linked").textContent="Tersimpan otomatis ke "+handle.name+" ("+new Date().toLocaleTimeString("id-ID")+")";
  }catch(e){$("linked").textContent="Gagal menyimpan ke file. Tutup file itu di Excel, lalu scan lagi."}
  saving=false;if(dirty){dirty=false;saveLinked()}
}

/* ---------- kamera ---------- */
async function startCam(id){
  stopCam();
  try{stream=await navigator.mediaDevices.getUserMedia({video:Object.assign({width:{ideal:1280},height:{ideal:720}},id?{deviceId:{exact:id}}:{facingMode:"environment"})})}
  catch(e){say("Kamera tidak bisa dibuka. Izinkan akses kamera dan buka lewat https atau localhost.",true);return}
  const v=$("v");v.srcObject=stream;await v.play();$("cam").textContent="Matikan kamera";
  const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="videoinput");
  if(devs.length>1){
    const s=$("dev");s.style.display="";s.innerHTML="";
    devs.forEach((d,i)=>s.add(new Option(d.label||"Kamera "+(i+1),d.deviceId)));
    const cur=stream.getVideoTracks()[0].getSettings().deviceId;if(cur)s.value=cur;
  }
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  const fmts=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","code_93","itf","codabar","qr_code"];
  let bd=null,zx=null,busy=false;
  if("BarcodeDetector" in window){try{bd=new BarcodeDetector({formats:fmts})}catch(e){bd=null}}
  const initZx=()=>{if(zx||!window.ZXing)return;const hh=new Map();hh.set(ZXing.DecodeHintType.TRY_HARDER,true);zx=new ZXing.MultiFormatReader();zx.setHints(hh)};
  if(!bd)initZx();
  timer=setInterval(async()=>{
    if(busy||v.videoWidth===0)return;busy=true;
    try{
      if(bd){try{const r=await bd.detect(v);if(r.length)scan(r[0].rawValue)}catch(e){bd=null;initZx()}}
      else if(zx){
        const s=Math.min(1,1280/v.videoWidth);cv.width=v.videoWidth*s;cv.height=v.videoHeight*s;
        cx.drawImage(v,0,0,cv.width,cv.height);
        try{scan(zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText())}catch(e){}
      }
    }catch(e){}
    busy=false;
  },150);
  say("Kamera aktif. Arahkan ke barcode.");
}
function stopCam(){clearInterval(timer);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("v").srcObject=null;$("cam").textContent="Mulai kamera"}

/* ---------- event ---------- */
$("cam").onclick=()=>stream?stopCam():startCam();
$("dev").onchange=e=>startCam(e.target.value);
$("man").addEventListener("keydown",e=>{if(e.key==="Enter"){scan(e.target.value);e.target.value=""}});
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{if(e.target.files[0])importMaster(e.target.files[0]);e.target.value=""};
$("dl").onclick=()=>{if(!S.master.length){say("Belum ada data.",true);return}XLSX.writeFile(workbook(),"master_barang_"+new Date().toISOString().slice(0,10)+".xlsx")};
$("clr").onclick=()=>{if(S.log.length&&confirm("Hapus semua catatan scan? Pasangan barcode tetap tersimpan.")){S.log=[];last="";after()}};
$("link").onclick=async()=>{
  if(!window.showSaveFilePicker){say("Simpan otomatis butuh Chrome atau Edge di komputer. Gunakan tombol Unduh .xlsx.",true);return}
  try{
    handle=await showSaveFilePicker({suggestedName:"master_barang_hasil.xlsx",types:[{description:"Excel",accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}}]});
    await saveLinked();say("File terhubung. Setiap perubahan langsung ditulis ke Excel.");
  }catch(e){}
};

index();render();
if(S.master.length)say("Data sebelumnya dipulihkan dari browser.");
</script>
</body>
</html>
